model:
  class_path: lightning_uq_box.uq_methods.EpinetRegression
  init_args:
    model:
      class_path: lightning_uq_box.models.MLP
      init_args:
        n_inputs: 1
        n_outputs: 1
        n_hidden: [50]
    optimizer:
      class_path: torch.optim.Adam
      init_args:
        lr: 0.003
    lr_scheduler:
      class_path: torch.optim.lr_scheduler.ConstantLR
    loss_fn:
      class_path: torch.nn.MSELoss
    index_dim: 4
    num_index_samples: 2
    num_pred_samples: 5
