uq_method:
  _target_: lightning_uq_box.uq_methods.VQVAEPrior
  # depth 3 at img_size 32 gives a 4x4 latent grid, so ancestral sampling is 16
  # sequential forward passes rather than the 256 a depth-2 encoder would need
  vq_vae:
    _target_: lightning_uq_box.uq_methods.VQVAE
    encoder:
      _target_: segmentation_models_pytorch.encoders.TimmUniversalEncoder
      name: resnet18
      depth: 3
    img_size: 32
    out_channels: 1
    num_samples: 2
    codebook_size: 16
    sample_codebook_temp: 1.0
  c_hidden: 16
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.003

data:
  _target_: lightning_uq_box.datamodules.ToyPixelwiseRegressionDataModule
  image_size: 32
