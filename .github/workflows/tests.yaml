name: tests
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  full-suite:
    name: full suite (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
    - name: Set up python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pip dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        python -m ensurepip
        python -m pip install --upgrade pip
        pip install -r requirements/requirements.txt -r requirements/tests.txt
        pip install numpy scipy
    - name: Run pytest checks
      shell: bash
      run: |
        python -m pytest tests --cov=lightning_uq_box --cov-report=xml
    - name: Report coverage
      uses: codecov/codecov-action@v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  compatibility-smoke:
    name: smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.13'
        - os: ubuntu-latest
          python-version: '3.14'
        - os: macos-latest
          python-version: '3.12'
        - os: windows-latest
          python-version: '3.12'
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
    - name: Set up python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pip dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        python -m ensurepip
        python -m pip install --upgrade pip
        pip install -r requirements/requirements.txt -r requirements/tests.txt
        pip install numpy scipy
    - name: Run smoke tests and collect configurations
      shell: bash
      run: |
        python -m pytest tests/models tests/datamodules tests/eval_utils tests/test_main.py
        python -m pytest --collect-only tests/uq_methods
