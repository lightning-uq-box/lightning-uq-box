name: tests
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
defaults:
  run:
    shell: bash

jobs:
  full-suite:
    name: full suite (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
    - name: Clone repo
      uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: '3.12'
        enable-cache: true
        prune-cache: true
        activate-environment: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Install dependencies
      run: uv sync --locked --extra tests
    - name: List dependencies
      run: uv tree
    - name: Run pytest checks
      run: pytest tests --cov=lightning_uq_box --cov-report=xml
    - name: Report coverage
      uses: codecov/codecov-action@v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  compatibility-smoke:
    name: smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.13'
        - os: ubuntu-latest
          python-version: '3.14'
        - os: macos-latest
          python-version: '3.12'
        - os: windows-latest
          python-version: '3.12'
    steps:
    - name: Clone repo
      uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        prune-cache: true
        activate-environment: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Install dependencies
      run: uv sync --locked --extra tests
    - name: List dependencies
      run: uv tree
    - name: Run smoke tests and collect configurations
      run: |
        pytest tests/models tests/datamodules tests/eval_utils tests/test_main.py
        pytest --collect-only tests/uq_methods
